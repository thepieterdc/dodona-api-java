name: Publish release

on:
  workflow_dispatch:

jobs:
  docs:
    name: Publish docs to GitHub Pages
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17
          server-id: github
          server-password: GITHUB_TOKEN
          server-username: thepieterdc
      - name: Cache the dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Generate the documentation
        run: mvn --batch-mode javadoc:javadoc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the documentation
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          cp -r api/docs/apidocs "$RUNNER_TEMP/site"
          git checkout --orphan gh-pages
          git rm -rfq --cached .
          git clean -fdxq
          cp -r "$RUNNER_TEMP/site/." .
          touch .nojekyll
          git add --all
          git commit -qm "Deploy documentation"
          git push --force origin gh-pages

  publish:
    name: Publish artifact to GitHub Packages
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
      - name: Create a release branch
        run: |
          git checkout -b release
          git push -u origin release
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: 17
          server-id: github
          server-password: GITHUB_TOKEN
          server-username: thepieterdc
      - name: Configure git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
      - name: Cache the dependencies
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Get the release version
        id: version
        run: |
          VERSION_RAW=v$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          VERSION="${VERSION_RAW//-SNAPSHOT/}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish package
        run: mvn --batch-mode release:prepare release:perform -P SKIP_IMPL_TESTS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release
        run: gh release create "$VERSION" --title "$VERSION" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
      - name: Open a pull request and enable auto-merge
        run: |
          gh pr create --base master --head release \
            --assignee thepieterdc \
            --title "Release $VERSION" \
            --body "Merge the maven release commits into the main branch."
          gh pr merge release --auto --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
